server:
  port: 8081

spring:
  application:
    name: riverflow-ai

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/riverflow?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: java
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

riverflow:
  ai:
    enabled: true
    audit-enabled: true
    sensitive-mask-enabled: true
    default-provider: kimi
    timeout: 30000
    retry: 1

    # 知识库与向量检索配置
    knowledge:
      vector-store:
        type: memory          # 可选：milvus / pgvector / memory
        default-collection: riverflow_default
#        milvus:
#          host: localhost
#          port: 19530
#          database: default
#          token: ''
#          secure: false
#          index-type: HNSW
#        pgvector:
#          url: jdbc:postgresql://localhost:5432/riverflow
#          username: postgres
#          password: postgres
#          schema: public
#      embedding:
#        type: memory          # 可选：openai / ollama / qwen / zhipu / memory（memory 不需要外部服务，仅测试）
#        base-url: https://api.openai.com/v1
#        api-key: ${OPENAI_API_KEY}
#        model: text-embedding-3-small
#        dimension: 1536
#        timeout: 30000
      embedding:
        type: ollama          # 可选：openai / ollama / qwen / zhipu / memory（memory 不需要外部服务，仅测试）
        base-url: http://localhost:11434
        model: nomic-embed-text
        dimension: 768
        timeout: 30000
      chunk:
        size: 512
        overlap: 64
        max-chunks: 100
      rag:
        enabled: true
        top-k: 5
        min-score: 0.7
        collection: riverflow_default

    providers:
      # 本地 Ollama（原生 API）
      - name: ollama
        type: ollama
        base-url: http://localhost:11434
        default-model: qwen2.5:14b
        temperature: 0.2

      # OpenAI 兼容接口（OpenAI / OneAPI / 自建代理）
      # - name: openai
      #   type: openai
      #   base-url: https://api.openai.com/v1
      #   api-key: ${OPENAI_API_KEY}
      #   default-model: gpt-4o-mini
      #   temperature: 0.2
      #   max-tokens: 4096

      # 智谱 GLM（OpenAI 兼容端点）
      # - name: zhipu
      #   type: zhipu
      #   base-url: https://open.bigmodel.cn/api/paas/v4
      #   api-key: ${ZHIPU_API_KEY}
      #   default-model: glm-4-flash
      #   temperature: 0.2

      # 通义千问（OpenAI 兼容端点）
      # - name: qwen
      #   type: qwen
      #   base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      #   api-key: ${DASHSCOPE_API_KEY}
      #   default-model: qwen-turbo
      #   temperature: 0.2

      # Kimi / Moonshot（OpenAI 兼容端点）
      - name: kimi
        type: openai
        base-url: https://api.moonshot.cn/v1
        api-key: ${KIMI_API_KEY}
        default-model: moonshot-v1-8k
        temperature: 0.2
        max-tokens: 4096

logging:
  level:
    com.riverflow.ai: debug
