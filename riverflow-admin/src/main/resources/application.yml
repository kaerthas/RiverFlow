server:
  port: 8080
  undertow:
    threads:
      io: 4
      # worker 线程在开启 Spring 虚拟线程后由平台线程改为虚拟线程承载，
      # 此处不再限制 worker 数量，交由 Spring Boot 自动管理。
      # worker: 20
    buffer-size: 1024
    max-entity-size: 104857600

spring:
  application:
    name: riverflow-admin

  # 开启 JDK 21 虚拟线程：Undertow 请求处理、Spring @Async、TaskScheduler 等均使用虚拟线程
  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      location: ${java.io.tmpdir}/riverflow-upload

  # 数据源配置（dynamic-datasource 格式）
  datasource:
    dynamic:
      primary: master
      strict: false
      enabled: true
      datasource:
        master:
          url: jdbc:mysql://127.0.0.1:3306/riverflow?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: root
          password: java # 本地开发使用明文，生产环境请使用Jasypt加密
          driver-class-name: com.mysql.cj.jdbc.Driver
          type: com.alibaba.druid.pool.DruidDataSource
      druid:
        initial-size: 5
        min-idle: 5
        max-active: 20
        max-wait: 60000
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        validation-query: SELECT 1
        stat-view-servlet:
          enabled: true
          url-pattern: /druid/*
          login-username: admin
          login-password: admin

  # Redis配置
  redis:
    host: 127.0.0.1
    port: 6379
    password:
    database: 0
    timeout: 10s
    lettuce:
      pool:
        min-idle: 0
        max-idle: 8
        max-active: 8
        max-wait: -1ms

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.riverflow.api.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    call-setters-on-nulls: true

# Knife4j API文档
knife4j:
  enable: true
  setting:
    language: zh_cn

# Jasypt加密
jasypt:
  encryptor:
    password: riverflow-secret-key
    algorithm: PBEWithMD5AndDES
    iv-generator-classname: org.jasypt.iv.NoIvGenerator

# JWT配置
jwt:
  secret: riverflow-jwt-secret-key-2024-spring-boot
  expiration: 86400000 # 24小时，单位毫秒
  header: Authorization
  token-prefix: "Bearer "

# 日志配置（具体格式与滚动策略由 logback-spring.xml 控制）
logging:
  file:
    path: ./logs
  level:
    com.riverflow: debug
    org.springframework.security: warn
riverflow:
  plugin:
    # 启用插件系统
    enabled: true
    dir: ${user.home}/riverflow/plugins

  # 虚拟线程执行器并发限制（JDK 21+ 生效）
  # 取值应小于最稀缺外部连接池的容量，防止虚拟线程无界增长导致连接池耗尽或 OOM
  virtual-thread:
    # 流程任务执行器：工作流节点多为 HTTP/DB 阻塞 I/O，默认 30
    flow-executor-max-concurrency: 30
    # 异步日志执行器：日志写入主要为 DB 操作，默认 10
    log-executor-max-concurrency: 10

  # AI 服务配置（独立微服务 riverflow-ai）
  ai-service:
    base-url: http://localhost:8081
    timeout: 60000