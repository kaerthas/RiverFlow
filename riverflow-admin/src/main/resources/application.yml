server:
  port: 8080
  undertow:
    threads:
      io: 4
      worker: 20
    buffer-size: 1024
    max-entity-size: 104857600

spring:
  application:
    name: riverflow-admin

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      location: ${java.io.tmpdir}/riverflow-upload

  # 数据源配置（dynamic-datasource 格式）
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:mysql://127.0.0.1:3306/riverflow?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: root
          password: java # 本地开发使用明文，生产环境请使用Jasypt加密
          driver-class-name: com.mysql.cj.jdbc.Driver
          type: com.alibaba.druid.pool.DruidDataSource
      druid:
        initial-size: 5
        min-idle: 5
        max-active: 20
        max-wait: 60000
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        validation-query: SELECT 1
        stat-view-servlet:
          enabled: true
          url-pattern: /druid/*
          login-username: admin
          login-password: admin

  # Redis配置
  redis:
    host: 127.0.0.1
    port: 6379
    password:
    database: 0
    timeout: 10s
    lettuce:
      pool:
        min-idle: 0
        max-idle: 8
        max-active: 8
        max-wait: -1ms

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.riverflow.api.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    call-setters-on-nulls: true

# Knife4j API文档
knife4j:
  enable: true
  setting:
    language: zh_cn

# Jasypt加密
jasypt:
  encryptor:
    password: riverflow-secret-key
    algorithm: PBEWithMD5AndDES
    iv-generator-classname: org.jasypt.iv.NoIvGenerator

# JWT配置
jwt:
  secret: riverflow-jwt-secret-key-2024-spring-boot
  expiration: 86400000 # 24小时，单位毫秒
  header: Authorization
  token-prefix: "Bearer "

# 日志
logging:
  level:
    com.riverflow: debug
    org.springframework.security: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
riverflow:
  plugin:
    # 启用插件系统
    enabled: true
    dir: ${user.home}/riverflow/plugins