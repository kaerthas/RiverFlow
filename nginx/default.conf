server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend routes (Vue Router history mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 统一 API 入口：/api（现有前端兼容前缀）、/admin（规范前缀）、/open（开放接口）
    # 全部转发到 Spring Cloud Gateway，由网关按 gateway_route 表做动态路由
    location ~ ^/(api|admin|open)/ {
        proxy_pass http://riverflow-gateway:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Knife4j 在线文档（经网关转发，建议仅内网/开发环境开放）
    location ~ ^/(doc\.html|webjars/|v3/api-docs|swagger-resources) {
        proxy_pass http://riverflow-gateway:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 回滚：网关不可用时，删除以上两个 location 块，恢复为直连 admin：
    # location /api/ {
    #     proxy_pass http://riverflow-admin:8080/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
