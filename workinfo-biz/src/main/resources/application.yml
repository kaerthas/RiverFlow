server:
  port: 8090

#配置xuxueli xxl-job
xxl:
  job:
    admin:
      addresses: http://127.0.0.1:8080/sx-job-admin
    executor:
      appname: xtapprovel-job-executor
      ip: ''
      port: 9997
      logpath: /data/applogs/esexchange/jobhandler
      logretentiondays: -1
    accessToken: ''



spring:
#  redis:
#    sentinel:
#      master: mymaster
#      nodes:
#        - 192.168.56.10:27001
#        - 192.168.56.10:27002
#        - 192.168.56.10:27003
  redis:
    # 地址
    host: 127.0.0.1
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码
    password:
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms
  application:
    name: @artifactId@
  resources:
    static-locations: classpath:/res/
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: oracle.jdbc.driver.OracleDriver
#      username: ${MYSQL-USER:ex_sj_workinfo}
#      password: ${MYSQL-PWD:123456}
#      url: jdbc:oracle:thin:@172.18.10.205:1521/zwfwptgov1
      username: osi
      password: 123456
      url: jdbc:oracle:thin:@127.0.0.1:1521/orcl
      queryDsSql: 'select * from API_DATASOURCE_CONFIG'
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: report
        login-password: 123456
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 10000
          merge-sql: false
        wall:
          config:
            multi-statement-allow: true
mybatis-plus:
  #configuration:
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  tenant-enable: ture
  mapper-locations: classpath:/mapper/*Mapper.xml
  global-config:
    banner: false
    db-config:
      id-type: auto
      field-strategy: NOT_EMPTY
  type-handlers-package:  io.yunho.yunho.common.data.handler
swagger:
  enabled: true
  title: Inspur Swagger API
  license: Powered By inspur
  licenseUrl: https://inspur.com/
  terms-of-service-url: https://inspur.com/
  contact:
    email: wujiang_job@163.com
    url: https://inspur.com
  authorization:
    name: Inspur Jason
    auth-regex: ^.*$
    authorization-scope-list:
      - scope: server
        description: server all
#加盐处理
jasypt:
  encryptor:
    password: yunhom
    algorithm: PBEWithMD5AndDES
    iv-generator-classname: org.jasypt.iv.NoIvGenerator

